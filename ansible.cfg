# Inventário do laboratório, detecção de Python e checagem de identidade SSH.
[defaults]
inventory = hosts.ini
interpreter_python = auto_silent
host_key_checking = True

# Reutiliza conexões e lê portas e chaves do arquivo gerado por vagrant ssh-config.
[ssh_connection]
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -F ./vagrant-ssh-config


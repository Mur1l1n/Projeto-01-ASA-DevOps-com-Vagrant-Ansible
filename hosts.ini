#Servidor de arquivos
# Cada grupo contém o nome DNS completo da VM correspondente.
# Este inventário exige que esses nomes sejam resolvidos pelo computador de controle;
# o provisionador do Vagrant gera seu próprio inventário para acessar as VMs.
[arq]
arq.murilo.rian.devops

#Servidor de banco de dados
[db]
db.murilo.rian.devops

#Servidor de aplicação
[app]
app.murilo.rian.devops

#Host cliente
[cli]
cli.murilo.rian.devops

# Reúne as quatro máquinas para aplicar configurações comuns.
[servidores:children]
arq
db
app
cli

# Conexão comum às quatro VMs: usuário vagrant, chave padrão local e porta 22.
# StrictHostKeyChecking=no dispensa confirmação de identidade dos hosts SSH.
[servidores:vars]
ansible_user=vagrant
ansible_ssh_private_key_file=~/.vagrant.d/insecure_private_key
ansible_port=22
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
#Servidor de arquivos
# Os nomes arq, db, app e cli correspondem aos aliases SSH gerados pelo Vagrant.
[arquivos]
arq

#Servidor de banco de dados
[banco]
db

#Servidor de aplicação
[aplicacao]
app

#Host cliente
[cliente]
cli

# Reúne as quatro máquinas para aplicar configurações comuns.
[servidores:children]
arquivos
banco
aplicacao
cliente

# Usuário de conexão utilizado pelo Ansible em todas as VMs.
[servidores:vars]
ansible_user=vagrant
---
# Configura os serviços de rede e armazenamento do arq com privilégios administrativos.
- name: Configura o Servidor DHCP
  hosts: arq
  become: true

  tasks:
    # DHCP: instala o serviço, seleciona eth1, copia o escopo e valida a configuração.
    - name: Instala o servidor DHCP
      apt:
        name: isc-dhcp-server
        update_cache: yes
        state: present

    - name: Configura a interface do servidor DHCP
      lineinfile:
        path: /etc/default/isc-dhcp-server
        regexp: '^INTERFACESv4='
        line: 'INTERFACESv4="eth1"'
      notify: restart dhcp

    - name: Copia o arquivo de configuração do DHCP
      copy:
        src: arquivos/dhcpd.conf
        dest: /etc/dhcp/dhcpd.conf
        owner: root
        group: root
        mode: "0644"
      notify: restart dhcp

    - name: Verifica a configuração do DHCP
      command: dhcpd -t -4 -cf /etc/dhcp/dhcpd.conf
      changed_when: false

    - name: Habilita o serviço DHCP
      service:
        name: isc-dhcp-server
        state: started
        enabled: yes
    
    # DNS: instala o BIND9 e publica as zonas de nomes e de resolução reversa.
    - name: Instala o servidor BIND9
      package:
        name: bind9
        state: present

    - name: Instala o pacote bind9utils
      package:
        name: bind9utils
        state: present

    - name: Copia o arquivo named.conf.options
      copy:
        src: arquivos/named.conf.options
        dest: /etc/bind/named.conf.options
        mode: '0644'
      notify: restart bind
    
    - name: Copia o arquivo named.conf.internal-zones
      copy:
        src: arquivos/named.conf.internal-zones
        dest: /etc/bind/named.conf.internal-zones
        mode: '0644'
      notify: restart bind

    - name: Copia a zona direta
      copy: 
        src: arquivos/murilo.rian.devops.db
        dest: /etc/bind/murilo.rian.devops.db
        mode: '0644'
      notify: restart bind

    - name: Copia a zona reversa
      copy: 
        src: arquivos/56.168.192.db
        dest: /etc/bind/56.168.192.db
        mode: '0644'
      notify: restart bind

    - name: Inclui as zonas internas no BIND9
      lineinfile:
        path: /etc/bind/named.conf
        line: 'include "/etc/bind/named.conf.internal-zones";'
        state: present
      notify: restart bind

    # Confere a sintaxe do BIND9 e os registros das duas zonas antes do reinício.
    - name: Verifica a configuração do BIND9
      command: named-checkconf -z
      changed_when: false

    - name: Verifica a zona direta
      command: named-checkzone murilo.rian.devops /etc/bind/murilo.rian.devops.db
      changed_when: false

    - name: Verifica a zona reversa
      command: named-checkzone 56.168.192.in-addr.arpa /etc/bind/56.168.192.db
      changed_when: false
    
    - name: Habilita o serviço BIND9
      service:
        name: bind9
        state: started
        enabled: yes

    # LVM: prepara os três discos e reúne seu espaço no grupo de volumes dados.
    - name: Instala o pacote lvm2
      apt:
        name: lvm2
        update_cache: yes
        state: present
      
    - name: Consulta os discos do arq
      command: lsblk --bytes --json --paths --output NAME,TYPE,SIZE,FSTYPE,PTTYPE,MOUNTPOINTS
      register: discos_arq
      changed_when: false

    - name: Consulta os volumes fisicos existentes
      command: pvs --reportformat json -o pv_name,vg_name
      register: relatorio_pvs
      changed_when: false

    - name: Inicializa a selecao dos discos
      set_fact:
        discos_lvm: []
        pvs_arq: "{{ (relatorio_pvs.stdout | from_json).report[0].pv }}"

    - name: Separa os PVs livres e os do grupo dados
      set_fact:
        pvs_livres: "{{ pvs_arq | selectattr('vg_name', 'equalto', '') | map(attribute='pv_name') | list }}"
        pvs_dados: "{{ pvs_arq | selectattr('vg_name', 'equalto', 'dados') | map(attribute='pv_name') | list }}"

    - name: Seleciona os discos adicionais de 10 GB
      set_fact:
        discos_lvm: "{{ discos_lvm + [item.name] }}"
      loop: "{{ (discos_arq.stdout | from_json).blockdevices }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - item.type == 'disk'
        - (item.size | int) in [10000000000, 10737418240]
        - not item.pttype
        - not (item.mountpoints | default([], true) | select | list)
        - >
          item.name in (pvs_livres + pvs_dados)
          or (not item.fstype and not (item.children | default([])))

    - name: Confirma os tres discos antes de alterar o LVM
      assert:
        that:
          - discos_lvm | length == 3
          - pvs_dados | length == 0 or (pvs_dados | sort) == (discos_lvm | sort)
        fail_msg: "Selecao inesperada: {{ discos_lvm }}. PVs em dados: {{ pvs_dados }}. Nenhum disco foi alterado por este bloco."
        success_msg: "Discos selecionados para o LVM: {{ discos_lvm }}"

    - name: Cria os volumes fisicos
      command:
        argv:
          - pvcreate
          - "{{ item }}"
      loop: "{{ discos_lvm }}"
      when: item not in (pvs_livres + pvs_dados)

    - name: Verifica se o VG dados existe
      command: vgs dados
      register: vg_existente
      changed_when: false
      failed_when: false

    - name: Cria o volume group dados
      command: 
        argv: "{{ ['vgcreate', 'dados'] + discos_lvm }}"
      when: vg_existente.rc != 0

    # Consulta o volume lógico e define sua criação com capacidade de 15 GB.
    - name: Verifica se o LV ifpb existe
      command: lvs dados/ifpb
      register: lv_existente
      changed_when: false
      failed_when: false
    
    - name: Cria o logical volume ifpb de 15 GB
      command: lvcreate -L 15G -n ifpb dados
      when: vg_existente.rc != 0

    # Identifica o sistema de arquivos e bloqueia a substituição de um formato diferente.
    - name: Verifica o sistema de arquivos do LV
      command: blkid -s TYPE -o value /dev/dados/ifpb
      register: tipo_fs
      changed_when: false
      failed_when: false
    
    - name: Impede formatação de sistema de arquivos diferente
      fail:
        msg: O volume ja possui um sistema de arquivos diferente de ext4.
      when:
        - tipo_fs.rc == 0
        - tipo_fs.stdout != "ext4"

    - name: Formata o LV ifpb com ext4
      command: mkfs.ext4 /dev/dados/ifpb
      when: tipo_fs.rc != 0
    
    # Montagem: registra /dados no fstab e verifica o destino antes de montar o volume.
    - name: Cria o diretorio dados
      file:
        path: /dados
        state: directory
        mode: '0755'
    
    - name: Configura a montagem automatica
      lineinfile: 
        path: /etc/fstab
        regexp: '^/dev/dados/ifpb\s+/dados\s+'
        line: '/dev/dados/ifpb /dados ext4 defaults 0 2'
        state: present
        backup: yes
    
    - name: Verifica se os dados ja esta montado
      command: findmnt -rn -o SOURCE --mountpoint /dados
      register: montagem_atual
      changed_when: false
      failed_when: false

    - name: Impede substituição de uma montagem existente
      fail:
        msg: O diretorio /dados ja utiliza outro dispositivo.
      when:
        - montagem_atual.rc == 0
        - "'ifpb' not in montagem_atual.stdout"
    
    - name: Monta o volume logico em dados
      command: mount /dados
      when: montagem_atual.rc != 0

    # NFS: instala o servidor e cria a identidade local usada nos acessos remotos.
    - name: Instala o servidor NFS
      apt:
        name: nfs-kernel-server
        update_cache: yes
        state: present

    - name: Cria o grupo nfs-ifpb
      group:
        name: nfs-ifpb
        state: present

    - name: Cria o usuario nfs-ifpb sem shell
      user:
        name: nfs-ifpb
        group: nfs-ifpb
        shell: /usr/sbin/nologin
        create_home: no
        state: present

    - name: Cria o diretorio compartilhado NFS
      file:
        path: /dados/nfs
        state: directory
        owner: nfs-ifpb
        group: nfs-ifpb
        mode: '0700'

    # Obtém UID/GID para mapear todos os usuários remotos para nfs-ifpb (all_squash).
    - name: Consulta o UID de nfs-ifpb
      command: id -u nfs-ifpb
      register: uid_nfs
      changed_when: false

    - name: Consulta o GID de nfs-ifpb
      command: id -g nfs-ifpb
      register: gid_nfs
      changed_when: false

    - name: Configura o compartilhamento NFS
      lineinfile:
        path: /etc/exports
        regexp: '^/dados/nfs\s+'
        line: "/dados/nfs 192.168.56.0/24(rw,sync,no_subtree_check,all_squash,anonuid={{ uid_nfs.stdout }},anongid={{ gid_nfs.stdout }})"
        state: present
      notify: atualiza exports nfs

    - name: Habilita o servidor NFS
      service:
        name: nfs-kernel-server
        state: started
        enabled: yes

  # Executados quando notificados: reiniciam DHCP/DNS e recarregam as exportações NFS.
  handlers:
    - name: restart dhcp
      service:
        name: isc-dhcp-server
        state: restarted

    - name: restart bind
      service:
        name: bind9
        state: restarted

    - name: atualiza exports nfs
      command: exportfs -ra
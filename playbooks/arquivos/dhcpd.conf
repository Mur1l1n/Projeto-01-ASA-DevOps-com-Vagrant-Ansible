# Servidor DHCP autoritativo
authoritative;

# Dominio e servidor DNS
option domain-name "murilo.rian.devops";
option domain-name-servers 192.168.56.105;

# Tempos de concessão
default-lease-time 180;
max-lease-time 3600;

# Escopo DHCP
subnet 192.168.56.0 netmask 255.255.255.0{
    range 192.168.56.50 192.168.56.100;
    option routers 192.168.56.1;
}

# Reserva de IP para o servidor db
host db {
    hardware ethernet 08:00:27:3a:00:01;
    fixed-address 192.168.56.102;
}

# Reserva de IP para o servidor app
host app {
    hardware ethernet 08:00:27:3a:00:02;
    fixed-address 192.168.56.152;
}
# Declara este servidor como autoridade DHCP da rede do laboratório.
authoritative;

# Entrega o sufixo DNS e o endereço do BIND9 no arq aos clientes.
# Atualizações dinâmicas de registros DNS ficam desativadas.
option domain-name "murilo.rian.devops";
option domain-name-servers 192.168.56.105;
ddns-update-style none;

# Concessões em segundos: padrão de 3 minutos e máximo de 1 hora.
default-lease-time 180;
max-lease-time 3600;

# Distribui endereços de .50 a .100 na rede /24 e anuncia .1 como gateway.
# As reservas abaixo ficam fora dessa faixa e devem coincidir com o Vagrantfile.
subnet 192.168.56.0 netmask 255.255.255.0{
    range 192.168.56.50 192.168.56.100;
    option routers 192.168.56.1;
}

# Reserva de IP para o servidor db
host db {
    hardware ethernet 08:00:27:3a:00:01;
    fixed-address 192.168.56.102;
}

# Reserva de IP para o servidor app
host app {
    hardware ethernet 08:00:27:3a:00:02;
    fixed-address 192.168.56.152;
}

---
# Configura a base comum das quatro VMs; become executa as tarefas como administrador.
- name: Configuração dos servidores
  hosts: servidores
  become: true
  serial: 1

  vars:
    ssh_keys_dir: "{{ playbook_dir }}/../keys"
    usuarios:
      - murilo
      - rian

  tasks:
    # Configuração das chaves ssh
    - name: diretorio local para colocar as chaves
      file:
        path: "{{ ssh_keys_dir }}"
        state: directory
        mode: '0700'
      delegate_to: localhost
      run_once: true
      become: false

    - name: Verificar a existencia das chaves privadas
      stat:
        path: "{{ ssh_keys_dir }}/{{ item }}"
      loop: "{{ usuarios }}"
      register: ssh_private_keys
      delegate_to: localhost
      run_once: true
      become: false

    - name: Gerar o par de chaves SSH local
      command: >
        ssh-keygen -t rsa -b 2048
        -f "{{ ssh_keys_dir }}/{{ item.item }}"
        -N ""
        -C "{{ item.item }}@devops"
      args:
        creates: "{{ ssh_keys_dir }}/{{ item.item }}"
      loop: "{{ ssh_private_keys.results }}"
      when: not item.stat.exists
      delegate_to: localhost
      run_once: true
      become: false

    - name: Garantir as permissões das chaves privadas
      file:
        path: "{{ ssh_keys_dir }}/{{ item }}"
        mode: '0600'
      loop: "{{ usuarios }}"
      delegate_to: localhost
      run_once: true
      become: false

    # Atualização e instalação dos pacotes
    - name: Pré-configurar o grub-pc
      shell: echo "grub-pc grub-pc/install_devices multiselect /dev/sda" | debconf-set-selections
      changed_when: false

    - name: Atualiza o cache dos pacotes
      apt:
        update_cache: yes

    - name: Atualiza o sistema operacional
      apt:
        upgrade: dist
        cache_valid_time: 3600
        dpkg_options: 'force-confold,force-confdef'
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Instala o chrony e cliente NFS
      apt:
        name:
          - chrony
          - nfs-common
        state: present

    # Fornece as ferramentas necessárias para acessar compartilhamentos NFS.
    - name: Instala o cliente NFS
      apt:
        name: nfs-common
        state: present

    # Configuração da zona de tempo
    - name: Comenta os pools NTP anteriores
      replace:
        path: /etc/chrony/chrony.conf
        regexp: '^(pool\s+(?!pool\.ntp\.br\b).*)$'
        replace: '# \1'
      notify: restart chrony

    - name: Configura o pool.ntp.br
      lineinfile:
        path: /etc/chrony/chrony.conf
        regexp: '^pool pool\.ntp\.br\b'
        line: "pool pool.ntp.br iburst"
        state: present
      notify: restart chrony

    - name: Habilita o serviço chrony
      service:
        name: chrony
        enabled: yes
        state: started

    - name: Consulta o fuso horario atual
      command: timedatectl show -p Timezone --value
      register: fuso_atual
      changed_when: false

    - name: Ajusta o fuso horario para America/Recife
      command: timedatectl set-timezone America/Recife
      when: fuso_atual.stdout != "America/Recife"

    # Criação do grupo
    - name: Cria o grupo ifpb
      group:
        name: ifpb
        state: present

    # Criação do usuário ifpb
    - name: Cria os usuarios murilo e rian
      user:
        name: "{{ item }}"
        group: ifpb
        groups: ifpb
        append: yes
        shell: /bin/bash
        create_home: yes
        state: present
      loop:
        - murilo
        - rian

    # Autoriza sudo sem senha para ifpb e valida a regra antes de gravar o arquivo.
    - name: Permite acesso root ao grupo ifpb usando sudo
      copy:
        dest: /etc/sudoers.d/ifpb
        content: "%ifpb ALL=(ALL:ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: "/usr/sbin/visudo -cf %s"

    # Mantém o usuário vagrant em um dos grupos autorizados para preservar seu acesso.
    - name: Garante a existencia do grupo vagrant
      group:
        name: vagrant
        state: present

    - name: Garante que vagrant pertence ao grupo vagrant
      user:
        name: vagrant
        groups: vagrant
        append: yes

    # Configuração das chaves ssh
    - name: Cria o diretorio .ssh dos usuarios
      file:
        path: "/home/{{ item }}/.ssh"
        state: directory
        owner: "{{ item }}"
        group: ifpb
        mode: "0700"
      loop:
        - murilo
        - rian

    - name: Copia as chaves publicas dos usuarios
      copy:
        src: "{{ ssh_keys_dir }}/{{ item }}.pub"
        dest: "/home/{{ item }}/.ssh/authorized_keys"
        owner: "{{ item }}"
        group: ifpb
        mode: "0600"
      loop:
        - murilo
        - rian

    # Instala o aviso exibido antes da autenticação.
    - name: Configura a mensagem de saudacao SSH
      copy:
        src: arquivos/issue.net
        dest: /etc/issue.net
        owner: root
        group: root
        mode: "0644"

    # Exige chave pública, bloqueia root e limita os grupos; valida a sintaxe do arquivo.
    - name: Configura as restricoes de acesso SSH
      copy:
        dest: /etc/ssh/sshd_config.d/00-projeto-asa.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          AuthenticationMethods publickey
          PermitRootLogin no
          AllowGroups vagrant ifpb
          Banner /etc/issue.net
        validate: "/usr/sbin/sshd -t -f %s"
      notify: restart ssh

  handlers:
    # Reinicia o Chrony somente quando uma tarefa notifica alteração na configuração.
    - name: restart chrony
      service:
        name: chrony
        state: restarted

    # Aplica a nova política reiniciando o SSH quando houver alteração notificada.
    - name: restart ssh
      service:
        name: ssh
        state: restarted

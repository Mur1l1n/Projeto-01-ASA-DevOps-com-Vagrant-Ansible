
---
# Monta o NFS do arq sob demanda em db, app e cli ao acessar /var/nfs.
- name: Configura montagem NFS automatica com autofs
  hosts: "db:app:cli"
  become: true

  tasks:
    - name: Cria o diretorio de montagem NFS
      file:
        path: /var/nfs
        state: directory
        mode: '0755'

    - name: Copia o mapa NFS
      copy:
        dest: /etc/auto.nfs
        content: "/var/nfs -fstype=nfs arq.murilo.rian.devops:/dados/nfs\n"
        mode: '0644'
      notify: restart autofs

    - name: Configura o mapa no auto.master
      lineinfile:
        path: /etc/auto.master
        line: '/- /etc/auto.nfs --timeout=60'
        insertbefore: '^\+auto\.master'
      notify: restart autofs

  # Recarrega os mapas reiniciando o autofs quando sua configuração muda.
  handlers:
    - name: restart autofs
      service:
        name: autofs
        state: restarted
        enabled: yes

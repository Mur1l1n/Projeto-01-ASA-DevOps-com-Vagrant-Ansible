
---
# Instala o MariaDB na VM db e mantém o serviço ativo, inclusive após reinicializações.
- name: Configura o servidor de banco de dados
  hosts: db
  become: true

  tasks:
    - name: Instala o servidor MariaDB e o Autofs
      apt:
        name: 
        - mariadb-server
        - autofs
        state: present
        update_cache: yes

- import_playbook: configura-autofs.yml
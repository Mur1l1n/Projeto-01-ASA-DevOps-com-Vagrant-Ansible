---
# Aplica usuários, SSH, atualização do sistema e sincronização de horário.
- import_playbook: configura-servidores.yml
# Instala MariaDB e autofs na VM db, atualizando antes o índice de pacotes.
# Não define bancos, contas SQL nem gerencia explicitamente o serviço MariaDB.
- name: Configura o servidor de banco de dados
  hosts: db
  become: true

  tasks:
    - name: Instala o servidor MariaDB e o Autofs
      apt:
        name:
          - mariadb-server
          - autofs
        state: present
        update_cache: yes

# Compartilha o mesmo mapa de montagem NFS utilizado por app e cli.
- import_playbook: configura-autofs.yml

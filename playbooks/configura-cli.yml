
---
# Prepara o cliente para executar o Firefox remoto e exibir sua janela via SSH/X11.
- import_playbook: configura-servidores.yml

- name: Configura o servidor cliente
  hosts: cli
  become: true

  tasks:
    # Firefox ESR executa na VM; xauth permite autenticação da sessão X11.
    # autofs atende à montagem NFS configurada pelo playbook importado ao final.
    - name: Instala Firefox ESR, Xauth e o Autofs
      apt:
        name:
          - firefox-esr
          - xauth
          - autofs
        state: present

    # Permite encaminhar janelas gráficas pela conexão SSH.
    # A máquina que abre a conexão precisa disponibilizar um servidor X.
    - name: Habilita X11 Forwarding
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^X11Forwarding'
        line: 'X11Forwarding yes'
      notify: restart ssh

  # Reinicia o SSH quando as opções de encaminhamento X11 forem alteradas.
  handlers:
    - name: restart ssh
      service:
        name: ssh
        state: restarted

# Reutiliza o mapa NFS para acessar os mesmos arquivos de app e db.
- import_playbook: configura-autofs.yml
---
- name: Configura a seguranca SSH dos servidores
  hosts: servidores
  become: true
  serial: 1

  tasks:
    - name: Garante a existencia do grupo vagrant
      group:
        name: vagrant
        state: present

    - name: Garante que vagrant pertence ao grupo vagrant
      user:
        name: vagrant
        groups: vagrant
        append: yes

    - name: Configura a mensagem de saudacao SSH
      copy:
        src: arquivos/issue.net
        dest: /etc/issue.net
        owner: root
        group: root
        mode: "0644"

    - name: Configura as restricoes de acesso SSH
      copy:
        dest: /etc/ssh/sshd_config.d/00-projeto-asa.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          AuthenticationMethods publickey
          PermitRootLogin no
          AllowGroups vagrant ifpb
          Banner /etc/issue.net
        validate: "/usr/sbin/sshd -t -f %s"
      notify: restart ssh

  handlers:
    - name: restart ssh
      service:
        name: ssh
        state: restarted
